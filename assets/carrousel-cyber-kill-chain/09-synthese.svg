m="translate(74,740) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 31V2M6 3h21l-5 7 5 7H6"/></g><text x="117" y="761" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">MISE EN SITUATION</text><text x="76" y="801" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Le parcours est un modèle de lecture :</text><text x="76" y="830" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">certaines attaques sautent, répètent ou</text><text x="76" y="859" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">combinent des phases.</text><rect x="550" y="725" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="548" y="719" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="548" y="737" width="4" height="193" rx="2" fill="#b8a1ff" stroke="none" stroke-width="2"/><g transform="translate(570,740) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h14l7 7v22H6Z"/><path d="M20 2v8h7M11 17h11M11 23h9"/></g><text x="613" y="761" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">EXEMPLE CONCRET</text><text x="572" y="801" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Chez NovaTech : repérage → fausse</text><text x="572" y="830" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">facture → email → faille → persistance →</text><text x="572" y="859" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">C2 → vol et chiffrement.</text><rect x="54" y="972" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="52" y="966" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="52" y="984" width="4" height="193" rx="2" fill="#ffa663" stroke="none" stroke-width="2"/><g transform="translate(74,987) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 16Q16 -3 31 16Q16 35 1 16Z"/><circle cx="16" cy="16" r="5"/></g><text x="117" y="1008" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">COMMENT DÉTECTER ?</text><text x="76" y="1048" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Relier les traces dans le temps. Un email</text><text x="76" y="1077" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">suspect suivi d’une alerte poste et</text><text x="76" y="1106" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">réseau forme un signal plus fort.</text><rect x="550" y="972" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="548" y="966" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="548" y="984" width="4" height="193" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><g transform="translate(570,987) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2L29 7V17Q27 27 16 32Q5 27 3 17V7Z"/><path d="M9 16l5 5 10-12"/></g><text x="613" y="1008" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">COMMENT SE DÉFENDRE ?</text><text x="572" y="1048" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Cumuler les protections. Le MFA aide</text><text x="572" y="1077" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">contre l’abus de comptes, mais ne</text><text x="572" y="1106" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">bloque pas toutes les formes d’attaque.</text><text x="54" y="1235" font-family="Montserrat" font-size="15" font-weight="500" fill="#aabbcf">Modèle Cyber Kill Chain® : Lockheed Martin. Scénario entièrement fictif.</text><rect x="54" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="129" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="204" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="279" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="354" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="429" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="504" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="579" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="654" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="729" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><text x="868" y="1307" font-family="Montserrat" font-size="19" font-weight="600" fill="white">09 / 10</text></svg>