path d="M314.0,542 L314.0,562" fill="none" stroke="#aabbcf" stroke-width="4" stroke-linecap="round"/><path d="M244.0,564 L384.0,564" fill="none" stroke="#aabbcf" stroke-width="4" stroke-linecap="round"/><text x="157" y="530" font-family="Montserrat" font-size="12" font-weight="600" fill="#aabbcf">POSTE DE LÉA</text><g transform="translate(270,360) scale(2.7)" fill="none" stroke="#ffa663" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2 32 30H0Z"/><path d="M16 12v8M16 25v1"/></g><path d="M517,425 L625,425" fill="none" stroke="#ffa663" stroke-width="4" stroke-linecap="round"/><path d="M625,425 L611.3596076470479,433.36299566289057" fill="none" stroke="#ffa663" stroke-width="4" stroke-linecap="round"/><path d="M625,425 L611.3596076470479,416.63700433710943" fill="none" stroke="#ffa663" stroke-width="4" stroke-linecap="round"/><rect x="662" y="323" width="270" height="210" rx="18" fill="#213650" stroke="#a397dc" stroke-width="2"/><text x="687" y="360" font-family="Montserrat" font-size="20" font-weight="700" fill="#b8a1ff">SYSTÈME</text><text x="684" y="401" font-family="Montserrat" font-size="18" font-weight="500" fill="white">Nouveau programme</text><circle cx="911" cy="394" r="5" fill="#ffa663"/><text x="684" y="444" font-family="Montserrat" font-size="18" font-weight="500" fill="white">Démarrage modifié</text><circle cx="911" cy="437" r="5" fill="#ffa663"/><text x="684" y="487" font-family="Montserrat" font-size="18" font-weight="500" fill="white">Accès conservé</text><circle cx="911" cy="480" r="5" fill="#ffa663"/><text x="146" y="565" font-family="Montserrat" font-size="18" font-weight="600" fill="#ffa663">UNE PRÉSENCE QUI PEUT SURVIVRE AU REDÉMARRAGE</text><text x="64" y="664" font-family="Montserrat" font-size="23" font-weight="600" fill="#35d9ed">Le programme cherche à conserver son accès.</text><rect x="54" y="725" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="52" y="719" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="52" y="737" width="4" height="193" rx="2" fill="#557bff" stroke="none" stroke-width="2"/><g transform="translate(74,740) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 31V2M6 3h21l-5 7 5 7H6"/></g><text x="117" y="761" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">MISE EN SITUATION</text><text x="76" y="801" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Un logiciel malveillant est installé. Il</text><text x="76" y="830" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">peut créer une persistance pour rester</text><text x="76" y="859" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">présent après un redémarrage.</text><rect x="550" y="725" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="548" y="719" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="548" y="737" width="4" height="193" rx="2" fill="#b8a1ff" stroke="none" stroke-width="2"/><g transform="translate(570,740) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h14l7 7v22H6Z"/><path d="M20 2v8h7M11 17h11M11 23h9"/></g><text x="613" y="761" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">EXEMPLE CONCRET</text><text x="572" y="801" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Sur le poste de Léa, un programme</text><text x="572" y="830" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">inconnu apparaît et modifie un</text><text x="572" y="859" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">mécanisme de démarrage</text><text x="572" y="888" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">automatique.</text><rect x="54" y="972" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="52" y="966" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="52" y="984" width="4" height="193" rx="2" fill="#ffa663" stroke="none" stroke-width="2"/><g transform="translate(74,987) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 16Q16 -3 31 16Q16 35 1 16Z"/><circle cx="16" cy="16" r="5"/></g><text x="117" y="1008" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">COMMENT DÉTECTER ?</text><text x="76" y="1048" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Détecter les logiciels nouveaux, les</text><text x="76" y="1077" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">changements de démarrage et les</text><text x="76" y="1106" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">modifications système inhabituelles.</text><rect x="550" y="972" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="548" y="966" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="548" y="984" width="4" height="193" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><g transform="translate(570,987) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2L29 7V17Q27 27 16 32Q5 27 3 17V7Z"/><path d="M9 16l5 5 10-12"/></g><text x="613" y="1008" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">COMMENT SE DÉFENDRE ?</text><text x="572" y="1048" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Activer antivirus et EDR, contrôler les</text><text x="572" y="1077" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">applications autorisées et isoler</text><text x="572" y="1106" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">rapidement un poste compromis.</text><text x="54" y="1235" font-family="Montserrat" font-size="15" font-weight="500" fill="#aabbcf">Persistance : mécanisme permettant de maintenir un accès dans le temps.</text><rect x="54" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="129" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="204" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="279" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="354" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="429" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="504" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="579" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="654" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="729" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><text x="868" y="1307" font-family="Montserrat" font-size="19" font-weight="600" fill="white">06 / 10</text></svg>