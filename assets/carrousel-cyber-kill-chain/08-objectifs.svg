"4" y="14" width="24" height="17" rx="3"/><path d="M9 14V9a7 7 0 0 1 14 0v5M16 21v4"/></g><text x="718" y="546" font-family="Montserrat" font-size="18" font-weight="600" fill="#ffa663">VOL + CHIFFREMENT</text><text x="64" y="664" font-family="Montserrat" font-size="23" font-weight="600" fill="#ffa663">Vol de données + chiffrement = double extorsion.</text><rect x="54" y="725" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="52" y="719" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="52" y="737" width="4" height="193" rx="2" fill="#557bff" stroke="none" stroke-width="2"/><g transform="translate(74,740) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 31V2M6 3h21l-5 7 5 7H6"/></g><text x="117" y="761" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">MISE EN SITUATION</text><text x="76" y="801" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Les criminels exfiltrent des données,</text><text x="76" y="830" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">chiffrent des fichiers et menacent de</text><text x="76" y="859" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">publier les informations volées.</text><rect x="550" y="725" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="548" y="719" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="548" y="737" width="4" height="193" rx="2" fill="#b8a1ff" stroke="none" stroke-width="2"/><g transform="translate(570,740) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h14l7 7v22H6Z"/><path d="M20 2v8h7M11 17h11M11 23h9"/></g><text x="613" y="761" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">EXEMPLE CONCRET</text><text x="572" y="801" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Des documents confidentiels quittent</text><text x="572" y="830" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">NovaTech. Des fichiers deviennent</text><text x="572" y="859" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">illisibles et une rançon est réclamée.</text><rect x="54" y="972" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="52" y="966" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="52" y="984" width="4" height="193" rx="2" fill="#ffa663" stroke="none" stroke-width="2"/><g transform="translate(74,987) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 16Q16 -3 31 16Q16 35 1 16Z"/><circle cx="16" cy="16" r="5"/></g><text x="117" y="1008" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">COMMENT DÉTECTER ?</text><text x="76" y="1048" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Alerter sur les volumes sortants</text><text x="76" y="1077" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">anormaux, les accès inhabituels et les</text><text x="76" y="1106" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">modifications massives de fichiers.</text><rect x="550" y="972" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="548" y="966" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="548" y="984" width="4" height="193" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><g transform="translate(570,987) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2L29 7V17Q27 27 16 32Q5 27 3 17V7Z"/><path d="M9 16l5 5 10-12"/></g><text x="613" y="1008" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">COMMENT SE DÉFENDRE ?</text><text x="572" y="1048" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Isoler les systèmes touchés. Activer le</text><text x="572" y="1077" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">plan de réponse, limiter les accès et</text><text x="572" y="1106" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">restaurer des sauvegardes isolées.</text><text x="54" y="1235" font-family="Montserrat" font-size="15" font-weight="500" fill="#aabbcf">Une sauvegarde restaure les données ; elle n’annule pas leur vol.</text><rect x="54" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="129" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="204" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="279" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="354" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="429" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="504" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="579" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="654" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="729" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><text x="868" y="1307" font-family="Montserrat" font-size="19" font-weight="600" fill="white">08 / 10</text></svg>