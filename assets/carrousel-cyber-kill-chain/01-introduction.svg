="26" height="27" rx="3" fill="#6dd8ec" stroke="none" stroke-width="2"/><rect x="456" y="326" width="26" height="27" rx="3" fill="#6dd8ec" stroke="none" stroke-width="2"/><rect x="456" y="374" width="26" height="27" rx="3" fill="#6dd8ec" stroke="none" stroke-width="2"/><rect x="456" y="422" width="26" height="27" rx="3" fill="#6dd8ec" stroke="none" stroke-width="2"/><rect x="504" y="326" width="26" height="27" rx="3" fill="#6dd8ec" stroke="none" stroke-width="2"/><rect x="504" y="374" width="26" height="27" rx="3" fill="#6dd8ec" stroke="none" stroke-width="2"/><rect x="504" y="422" width="26" height="27" rx="3" fill="#6dd8ec" stroke="none" stroke-width="2"/><rect x="552" y="326" width="26" height="27" rx="3" fill="#6dd8ec" stroke="none" stroke-width="2"/><rect x="552" y="374" width="26" height="27" rx="3" fill="#6dd8ec" stroke="none" stroke-width="2"/><rect x="552" y="422" width="26" height="27" rx="3" fill="#6dd8ec" stroke="none" stroke-width="2"/><text x="418" y="503" font-family="Montserrat" font-size="28" font-weight="700" fill="white">NovaTech</text><rect x="740" y="342" width="140" height="174" rx="12" fill="#20395b" stroke="#5879a7" stroke-width="2"/><rect x="754" y="360" width="112" height="33" rx="5" fill="#11223b" stroke="none" stroke-width="2"/><circle cx="769" cy="376" r="4" fill="#35d9ed"/><path d="M786,376 L846,376" fill="none" stroke="#5879a7" stroke-width="3" stroke-linecap="round"/><rect x="754" y="404" width="112" height="33" rx="5" fill="#11223b" stroke="none" stroke-width="2"/><circle cx="769" cy="420" r="4" fill="#35d9ed"/><path d="M786,420 L846,420" fill="none" stroke="#5879a7" stroke-width="3" stroke-linecap="round"/><rect x="754" y="448" width="112" height="33" rx="5" fill="#11223b" stroke="none" stroke-width="2"/><circle cx="769" cy="464" r="4" fill="#35d9ed"/><path d="M786,464 L846,464" fill="none" stroke="#5879a7" stroke-width="3" stroke-linecap="round"/><text x="750" y="504" font-family="Montserrat" font-size="12" font-weight="600" fill="#aabbcf">RÉSEAU INTERNE</text><path d="M621,420 L720,420" fill="none" stroke="#35d9ed" stroke-width="4" stroke-linecap="round"/><path d="M720,420 L706.3596076470479,428.36299566289057" fill="none" stroke="#35d9ed" stroke-width="4" stroke-linecap="round"/><path d="M720,420 L706.3596076470479,411.63700433710943" fill="none" stroke="#35d9ed" stroke-width="4" stroke-linecap="round"/><circle cx="190" cy="388" r="62" fill="#29324d"/><g transform="translate(150,349) scale(2.5)" fill="none" stroke="#ffa663" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 16Q16 -3 31 16Q16 35 1 16Z"/><circle cx="16" cy="16" r="5"/></g><path d="M258,389 L374,389" fill="none" stroke="#ffa663" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 8"/><text x="96" y="541" font-family="Montserrat" font-size="18" font-weight="600" fill="#ffa663">UNE MENACE OBSERVE</text><text x="402" y="557" font-family="Montserrat" font-size="18" font-weight="600" fill="#35d9ed">45 SALARIÉS · PME CONNECTÉE</text><text x="64" y="664" font-family="Montserrat" font-size="23" font-weight="600" fill="#35d9ed">Observer. Piéger. Compromettre. Agir.</text><rect x="54" y="725" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="52" y="719" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="52" y="737" width="4" height="193" rx="2" fill="#557bff" stroke="none" stroke-width="2"/><g transform="translate(74,740) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 31V2M6 3h21l-5 7 5 7H6"/></g><text x="117" y="761" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">MISE EN SITUATION</text><text x="76" y="801" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">La Cyber Kill Chain, modèle de</text><text x="76" y="830" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Lockheed Martin, décrit sept phases</text><text x="76" y="859" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">pour repérer où interrompre une</text><text x="76" y="888" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">attaque.</text><rect x="550" y="725" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="548" y="719" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="548" y="737" width="4" height="193" rx="2" fill="#b8a1ff" stroke="none" stroke-width="2"/><g transform="translate(570,740) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h14l7 7v22H6Z"/><path d="M20 2v8h7M11 17h11M11 23h9"/></g><text x="613" y="761" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">EXEMPLE CONCRET</text><text x="572" y="801" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">NovaTech, PME fictive de 45 salariés, est</text><text x="572" y="830" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">ciblée pour voler ses données, chiffrer</text><text x="572" y="859" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">ses fichiers et exiger une rançon.</text><rect x="54" y="972" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="52" y="966" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="52" y="984" width="4" height="193" rx="2" fill="#ffa663" stroke="none" stroke-width="2"/><g transform="translate(74,987) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 16Q16 -3 31 16Q16 35 1 16Z"/><circle cx="16" cy="16" r="5"/></g><text x="117" y="1008" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">COMMENT DÉTECTER ?</text><text x="76" y="1048" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Croiser les signaux des emails, des</text><text x="76" y="1077" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">postes et du réseau. Une alerte isolée ne</text><text x="76" y="1106" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">prouve pas une attaque.</text><rect x="550" y="972" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="548" y="966" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="548" y="984" width="4" height="193" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><g transform="translate(570,987) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2L29 7V17Q27 27 16 32Q5 27 3 17V7Z"/><path d="M9 16l5 5 10-12"/></g><text x="613" y="1008" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">COMMENT SE DÉFENDRE ?</text><text x="572" y="1048" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Prévoir plusieurs barrières : prévention,</text><text x="572" y="1077" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">détection et réponse. Bloquer une</text><text x="572" y="1106" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">phase peut perturber la suite.</text><text x="54" y="1235" font-family="Montserrat" font-size="15" font-weight="500" fill="#aabbcf">Un modèle utile pour agir ; toutes les attaques ne suivent pas un parcours linéaire.</text><rect x="54" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="129" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="204" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="279" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="354" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="429" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="504" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="579" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="654" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="729" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><text x="868" y="1307" font-family="Montserrat" font-size="19" font-weight="600" fill="white">01 / 10</text></svg>