rm="translate(133,329) scale(1.6)" fill="none" stroke="#35d9ed" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3 29 17-17M20 12a9 9 0 0 1 8-10l-4 7 3 4 7-3a9 9 0 0 1-13 9"/></g><text x="113" y="409" font-family="Montserrat" font-size="14" font-weight="700" fill="#35d9ed">MISES À JOUR</text><g transform="translate(799,329) scale(1.6)" fill="none" stroke="#35d9ed" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="14" width="24" height="17" rx="3"/><path d="M9 14V9a7 7 0 0 1 14 0v5M16 21v4"/></g><text x="779" y="409" font-family="Montserrat" font-size="14" font-weight="700" fill="#35d9ed">MFA</text><g transform="translate(117,497) scale(1.6)" fill="none" stroke="#35d9ed" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 16Q16 -3 31 16Q16 35 1 16Z"/><circle cx="16" cy="16" r="5"/></g><text x="97" y="577" font-family="Montserrat" font-size="14" font-weight="700" fill="#35d9ed">VIGILANCE</text><g transform="translate(805,497) scale(1.6)" fill="none" stroke="#35d9ed" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h14l7 7v22H6Z"/><path d="M20 2v8h7M11 17h11M11 23h9"/></g><text x="785" y="577" font-family="Montserrat" font-size="14" font-weight="700" fill="#35d9ed">SAUVEGARDES</text><g transform="translate(484,281) scale(1.6)" fill="none" stroke="#35d9ed" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2L29 7V17Q27 27 16 32Q5 27 3 17V7Z"/><path d="M9 16l5 5 10-12"/></g><text x="464" y="361" font-family="Montserrat" font-size="14" font-weight="700" fill="#35d9ed">RÉPONSE</text><path d="M228,393 L387,418" fill="none" stroke="#35d9ed" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 8"/><path d="M678,418 L776,393" fill="none" stroke="#35d9ed" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 8"/><text x="64" y="664" font-family="Montserrat" font-size="23" font-weight="600" fill="#35d9ed">Merci ! Partagez ce carrousel pour diffuser les bons réflexes.</text><rect x="54" y="725" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="52" y="719" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="52" y="737" width="4" height="193" rx="2" fill="#557bff" stroke="none" stroke-width="2"/><g transform="translate(74,740) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 31V2M6 3h21l-5 7 5 7H6"/></g><text x="117" y="761" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">MISE EN SITUATION</text><text x="76" y="801" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">1. Mettre à jour les systèmes. 2. Sécuriser</text><text x="76" y="830" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">les accès avec une authentification</text><text x="76" y="859" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">multifacteur (MFA).</text><rect x="550" y="725" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="548" y="719" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="548" y="737" width="4" height="193" rx="2" fill="#b8a1ff" stroke="none" stroke-width="2"/><g transform="translate(570,740) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h14l7 7v22H6Z"/><path d="M20 2v8h7M11 17h11M11 23h9"/></g><text x="613" y="761" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">EXEMPLE CONCRET</text><text x="572" y="801" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">3. Sensibiliser les collaborateurs. Chez</text><text x="572" y="830" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">NovaTech, Léa vérifie et signale une</text><text x="572" y="859" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">facture inattendue.</text><rect x="54" y="972" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="52" y="966" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="52" y="984" width="4" height="193" rx="2" fill="#ffa663" stroke="none" stroke-width="2"/><g transform="translate(74,987) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 16Q16 -3 31 16Q16 35 1 16Z"/><circle cx="16" cy="16" r="5"/></g><text x="117" y="1008" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">COMMENT DÉTECTER ?</text><text x="76" y="1048" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">5. Surveiller et réagir aux incidents :</text><text x="76" y="1077" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">traiter les alertes, savoir qui contacter et</text><text x="76" y="1106" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">exercer le plan de réponse.</text><rect x="550" y="972" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="548" y="966" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="548" y="984" width="4" height="193" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><g transform="translate(570,987) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2L29 7V17Q27 27 16 32Q5 27 3 17V7Z"/><path d="M9 16l5 5 10-12"/></g><text x="613" y="1008" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">COMMENT SE DÉFENDRE ?</text><text x="572" y="1048" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">4. Sauvegarder les données : copies</text><text x="572" y="1077" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">isolées ou immuables, restaurations</text><text x="572" y="1106" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">testées et accès protégés.</text><text x="54" y="1235" font-family="Montserrat" font-size="15" font-weight="500" fill="#aabbcf">Prévenir · détecter · répondre · reprendre l’activité.</text><rect x="54" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="129" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="204" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="279" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="354" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="429" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="504" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="579" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="654" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="729" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><text x="868" y="1307" font-family="Montserrat" font-size="19" font-weight="600" fill="white">10 / 10</text></svg>