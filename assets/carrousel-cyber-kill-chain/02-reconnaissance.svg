6" y="1106" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">collecte passive reste souvent invisible.</text><rect x="550" y="972" width="480" height="229" rx="18" fill="#091326" stroke="none" stroke-width="2"/><rect x="548" y="966" width="480" height="229" rx="18" fill="#f3f6fc" stroke="none" stroke-width="2"/><rect x="548" y="984" width="4" height="193" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><g transform="translate(570,987) scale(0.85)" fill="none" stroke="#2b4b78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2L29 7V17Q27 27 16 32Q5 27 3 17V7Z"/><path d="M9 16l5 5 10-12"/></g><text x="613" y="1008" font-family="Montserrat" font-size="16" font-weight="700" fill="#28405f">COMMENT SE DÉFENDRE ?</text><text x="572" y="1048" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Limiter les détails sensibles publiés.</text><text x="572" y="1077" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">Inventorier les actifs exposés et surveiller</text><text x="572" y="1106" font-family="Montserrat" font-size="22" font-weight="500" fill="#101d38">les journaux des services.</text><text x="54" y="1235" font-family="Montserrat" font-size="15" font-weight="500" fill="#aabbcf">Reconnaissance passive : consulter des sources publiques sans interagir avec la cible.</text><rect x="54" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="129" y="1298" width="63" height="4" rx="2" fill="#35d9ed" stroke="none" stroke-width="2"/><rect x="204" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="279" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="354" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="429" y="1298" width="63" height="4" rx="2" fill="#344762" stroke="none" stroke-width="2"/><rect x="504" y="129